[package]
name = "nnt"
version = "0.1.0"
edition = "2021"
authors = ["Ch1ffr3punk"]
description = "Nym Network Topology"
license = "Apache 2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "socks", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
